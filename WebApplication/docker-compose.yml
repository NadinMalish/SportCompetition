services:
  web:
    build:
      context: .
      dockerfile: WebApplication/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      DocumentStorage__BaseUrl: "http://files:8081"
      Redis__ConnectionString: "redis:6379"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Username=app;Password=appsecret;Database=appdb;SSL Mode=Disable"
    depends_on:
      - files
      - redis
      - postgres
    networks:
      - backend

  files:
    build:
      context: .
      dockerfile: FileServerHost/Dockerfile
    ports:
      - "8081:8081"
    environment:
      ASPNETCORE_URLS: "http://+:8081"
      ASPNETCORE_ENVIRONMENT: Development
      MongoDb__ConnectionString: "mongodb://app:appsecret@mongo:27017/docservice?authSource=admin"
    depends_on:
      - mongo
    networks:
      - backend

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: app
      POSTGRES_PASSWORD: appsecret
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: admin
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - backend

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - backend

networks:
  backend:

volumes:
  mongo_data:
  pg_data:
